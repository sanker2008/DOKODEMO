name: Android Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0, v2.1.3, etc.
  workflow_dispatch: # Allows manual trigger from UI

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk DokoDemo-arm64-v8a-release.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk DokoDemo-armeabi-v7a-release.apk
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            DokoDemo-arm64-v8a-release.apk
            DokoDemo-armeabi-v7a-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
